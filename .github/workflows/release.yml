name: release

# release-please keeps a release PR open from the conventional commits (feat:, fix:, …) on main.
# Merging it tags a release; then every platform builds the app and uploads its archive, and one
# job merges the build fragments into update.json, which the app checks at
# https://github.com/khromov/strata-gpuix-svelte/releases/latest/download/update.json
# (standalone.ts names that URL). docs/internals.md covers the secrets, all of them optional.
# Run by hand (`gh workflow run release.yml`), it only builds and checks, publishes nothing, and
# keeps each zip as a workflow artifact, which is how to try a build before a real release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # A PAT lets the release PR trigger test.yml; GITHUB_TOKEN's events never start workflows.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  build:
    needs: release
    # release is skipped on a manual run, and always() keeps this job from being skipped with it.
    if: ${{ always() && (needs.release.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, windows-11-arm, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # The Linux prebuild of @gpuix/native links gpui's X11 client, and the check below loads it.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb1 libxkbcommon0 libxkbcommon-x11-0
      - run: bun install --frozen-lockfile
      - run: bun install --cwd ml --frozen-lockfile
      - name: Import the macOS signing certificate
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          # A new keychain locks itself after five idle minutes, which a slow build can outlast.
          security set-keychain-settings -lut 21600 build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain
          rm certificate.p12
      # Two steps, so the Apple secrets only ever reach the macOS runner.
      - if: runner.os == 'macOS'
        run: bun build.ts --archive
        env:
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - if: runner.os != 'macOS'
        run: bun build.ts --archive
      # With a certificate configured, a build that came out unsigned or not notarized fails here
      # rather than reaching every installed copy.
      - name: Refuse an unsigned build
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        run: |
          codesign --verify --deep --strict dist/Strata.app
          spctl --assess --type execute dist/Strata.app
      # Starts the real ML worker from the built app, with no model and no window. To a file, since
      # a Windows app has no console of its own to write to.
      - name: Check that the built app can start its ML worker
        env:
          GPUIX_BRAIN_DIR: ${{ runner.temp }}/strata-verify
        run: |
          case "$RUNNER_OS" in
            macOS) app=dist/Strata.app/Contents/MacOS/strata ;;
            Windows) app=dist/strata.exe ;;
            *) app=dist/strata ;;
          esac
          code=0
          "$app" --verify-runtime > verify.log 2>&1 || code=$?
          cat verify.log
          exit "$code"
      # --clobber lets a re-run replace its upload.
      - if: needs.release.outputs.release_created == 'true'
        run: gh release upload --clobber "$TAG" dist/strata-*.zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag_name }}
      - if: needs.release.outputs.release_created == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: update-${{ matrix.os }}
          path: dist/update-*.json
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: strata-test-build-${{ matrix.os }}
          path: dist/strata-*.zip
          if-no-files-found: error
          retention-days: 7

  # Runs even when a platform failed to build, so the others still get their update; the manifest
  # then lists only what was uploaded. Until it runs, the new release's manifest is a 404 and apps
  # keep their version.
  manifest:
    needs: [release, build]
    if: ${{ !cancelled() && needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          pattern: update-*
          merge-multiple: true
          path: fragments
      - run: gh release view "$TAG" --json body --jq .body > notes.md
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag_name }}
      # --no-install: the bin comes from the gpuix-svelte in node_modules, never from the registry.
      # With the GPUIX_UPDATE_PUBLIC_KEY variable set, an unsigned or wrongly signed manifest
      # fails here instead of being refused by every app in the field.
      - run: |
          bunx --bun --no-install gpuix-svelte update manifest --out update.json \
            --base-url "https://github.com/$REPO/releases/download/$TAG/" \
            --notes notes.md --url "https://github.com/$REPO/releases/tag/$TAG" \
            ${PUBLIC_KEY:+--public-key "$PUBLIC_KEY"} \
            fragments/*.json
          gh release upload --clobber "$TAG" update.json
        env:
          GH_TOKEN: ${{ github.token }}
          GPUIX_UPDATE_KEY: ${{ secrets.GPUIX_UPDATE_KEY }}
          PUBLIC_KEY: ${{ vars.GPUIX_UPDATE_PUBLIC_KEY }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag_name }}

name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The gpuix-svelte bin is a Node script that starts Bun under --bun.
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@v2
      # The Linux prebuild of @gpuix/native links gpui's X11 client, and a runner has no
      # desktop libs. test/smoke.ts skips itself there (no headless renderer), so Linux
      # runs the typecheck and test/brain.ts.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb1 libxkbcommon0 libxkbcommon-x11-0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
